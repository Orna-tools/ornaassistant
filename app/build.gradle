import java.text.SimpleDateFormat
import java.util.Date

// Git-based version management
def getGitCommitCount() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
        }
        return Integer.parseInt(stdout.toString().trim()) + 3000 // Offset to maintain version progression
    } catch (Exception e) {
        println "Warning: Could not get git commit count, using default"
        return 3119 // Ensure this default is sensible for your versioning
    }
}

def getGitHash() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return "unknown"
    }
}

def getBuildDate() {
    def dateFormat = new SimpleDateFormat("yyyyMMdd")
    return dateFormat.format(new Date())
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // id 'kotlin-kapt' // Replaced by KSP for Hilt
    id 'com.google.dagger.hilt.android' // Keep Hilt plugin for Gradle tasks and application class generation
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose' // Apply Compose Compiler plugin explicitly
    id 'androidx.room' // Apply Room Gradle plugin for schema export and other helpers
}

android {
    namespace 'com.lloir.ornaassistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lloir.ornaassistant'
        minSdk 30
        targetSdk 36  // Target Android 16 (VanillaIceCream)
        versionCode getGitCommitCount() + 9900
        versionName "2.1.${getGitCommitCount() - 5000}-${getBuildDate()}.${getGitHash()}"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }

        // GitHub API token for debug log submission
        def githubToken = System.getenv("GITHUB_DEBUG_TOKEN") ?: "github_pat_your_token_here"
        buildConfigField "String", "GITHUB_TOKEN", "\"${githubToken}\""
        buildConfigField "String", "GITHUB_REPO_OWNER", "\"Orna-tools\""
        buildConfigField "String", "GITHUB_REPO_NAME", "\"OA-ISSUES\""

        // For Android 16 (API 36) and higher, 16KB page size alignment might affect some apps.
        // Setting pageSizeCompat to "false" opts out of compatibility treatments for 4KB pages
        // if your app is prepared for 16KB alignment or doesn't use ashmem in problematic ways.
        // Test thoroughly.
        manifestPlaceholders = [pageSizeCompat: "false"]
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                println "Warning: Keystore information not found for release build. Build will be unsigned or use debug signing."
                // Optionally, make it use debug signing if release keys aren't found
                // signingConfig signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            buildConfigField "String", "GITHUB_TOKEN", "\"debug_token_disabled\""
            // For debug builds, it's often helpful to not strip symbols for easier debugging
            // However, stripDebugDebugSymbols is a separate task.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
                '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api'
        ]
    }

    buildFeatures {
        compose true
        buildConfig true // You are using buildConfigField, so this is correct
    }

    packagingOptions { // Renamed from 'packaging' for clarity and standard practice
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/LICENSE.md' // Example: if you see these specific files
            excludes += 'META-INF/LICENSE-notice.md'
        }
    }

    // Configure KSP arguments if needed, e.g., for Room schema location
    // This is now handled by the Room Gradle plugin and the 'room' block below
}

// Room configuration
room {
    schemaDirectory "$projectDir/schemas"
}

// This block is for KSP arguments directly if not using a specific plugin's extension
// ksp {
//    arg("room.schemaLocation", "$projectDir/schemas")
// }


configurations.all {
    resolutionStrategy {
        // Force the use of patched versions to address:
        // - CVE-2024-7254 (protobuf DoS)
        // - CVE-2023-44487 (HTTP/2 Rapid Reset)
        // - SniHandler heap allocation vulnerability (netty-handler)
        // - HttpPostRequestDecoder vulnerability (netty-codec-http)
        // - Unsafe environment file reading vulnerability (netty-common)
        // - Infinite loop vulnerability (commons-compress)
        // - Allocation of Resources Without Limits vulnerability (commons-compress)
        force 'com.google.protobuf:protobuf-kotlin:3.25.5'
        force 'com.google.protobuf:protobuf-java:3.25.5'
        force 'io.netty:netty-codec-http2:4.1.100.Final'
        force 'io.netty:netty-handler:4.1.118.Final'
        force 'io.netty:netty-codec-http:4.1.108.Final'
        force 'io.netty:netty-common:4.1.118.Final'
        force 'org.apache.commons:commons-compress:1.26.0'
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'

    // Compose BOM and UI
    implementation platform('androidx.compose:compose-bom:2025.06.01') // Ensure this BOM is compatible with your Compose Compiler Plugin
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.9.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'

    // Hilt Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.56.2' // Keep the Hilt Android library
    ksp 'com.google.dagger:hilt-compiler:2.56.2'        // Use KSP for Hilt's annotation processor

    // Room Database
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'

    // Network
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.10.2'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    ksp 'androidx.hilt:hilt-compiler:1.2.0' // KSP for Hilt WorkManager integration

    // Preferences
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Window Size Classes for adaptive layouts (Good for Android 16+)
    implementation 'androidx.compose.material3:material3-window-size-class:1.3.2'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.13.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'androidx.room:room-testing:2.7.2'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'com.google.android.material:material:1.12.0'
}